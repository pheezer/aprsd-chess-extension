[tox]
envlist =
    fmt
    lint
    py{311,312,313}
skip_missing_interpreters = true

[testenv]
deps =
    -r{toxinidir}/requirements.txt
    -r{toxinidir}/requirements-dev.txt
commands =
    {envpython} -m pytest {posargs}

# aprsd 4.2.4 is the current PyPI release; the clients need >= 4.2.
[testenv:aprsd424]
basepython = python3.11
deps =
    aprsd==4.2.4
    -r{toxinidir}/requirements.txt
    -r{toxinidir}/requirements-dev.txt
commands =
    {envpython} -m pytest {posargs}

# The cluster runs aprsd 4.1.2 (pheezer/docker-aprsd); keep the plugin working there.
[testenv:aprsd412]
basepython = python3.11
deps =
    aprsd==4.1.2
    -r{toxinidir}/requirements.txt
    -r{toxinidir}/requirements-dev.txt
commands =
    {envpython} -m pytest {posargs}

[testenv:lint]
skip_install = true
deps =
    ruff
commands =
    ruff check aprsd_chess_extension tests tools digipi
    ruff format --check aprsd_chess_extension tests tools digipi

[testenv:fmt]
skip_install = true
deps =
    ruff
commands =
    ruff format aprsd_chess_extension tests tools digipi
    ruff check --fix aprsd_chess_extension tests tools digipi
